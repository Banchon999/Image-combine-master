[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imbine"
version = "0.2.0"
description = "แอพต่อภาพเว็บตูน - ต่อภาพแนวตั้ง/แนวนอน พร้อมระบบตรวจสอบกันพลาด"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
dependencies = ["Pillow>=9.1", "PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]
auto = ["opencv-python-headless>=4.7", "numpy>=1.21"]
qt = []

[project.scripts]
imbine = "imbine.__main__:main"

[tool.setuptools.packages.find]
include = ["imbine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ อยู่ใน sys.path ด้วย เพื่อให้ test ต่าง ๆ import ค่าคงที่จาก conftest ได้
pythonpath = [".", "tests"]
addopts = "-q"
